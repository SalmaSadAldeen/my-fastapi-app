services:
  - type: web
    name: my-fastapi-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: APP_ENV
        value: production
      - key: APP_NAME
        sync: false
      - key: APP_VERSION
        sync: false
      - key: WELCOME_MESSAGE
        sync: false
      - key: API_SECRET
        sync: false
